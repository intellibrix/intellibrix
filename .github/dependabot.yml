version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/packages/*', '/examples/*', '/website']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: pino
        update-types: ['version-update:semver-major']
      - dependency-name: sqlite3
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        patterns: ['@biomejs/*', '@changesets/*', '@commitlint/*', 'lefthook', 'typedoc', 'vitest', 'tsdown', 'publint', '@arethetypeswrong/*', '@microsoft/api-extractor']
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
