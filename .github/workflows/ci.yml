name: CI

on:
  pull_request:
  push:
    branches: [feat/v1.0.0, master]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GHSA-vfj7-8cjw-p6xm (braces, via fast-glob in @intellibrix/workspace) has no patched release;
      # it is ignored in pnpm-workspace.yaml and mitigated by assertSafeGlob in packages/workspace. Remove once fixed upstream.
      - run: pnpm audit --prod --audit-level=high

  build-test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_URI: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm biome ci .
      - run: pnpm -r build
      - run: pnpm check:packages
      - run: pnpm check:api
      - run: pnpm smoke:examples
      - run: pnpm -r test
