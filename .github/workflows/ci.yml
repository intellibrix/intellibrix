name: CI

on:
  pull_request:
  push:
    branches: [feat/v1.0.0, master]

jobs:
  build-test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_URI: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm biome ci .
      - run: pnpm -r build
      - run: pnpm check:packages
      - run: pnpm check:api
      - run: pnpm smoke:examples
      - run: pnpm -r test
