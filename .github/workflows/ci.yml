name: CI

on:
  pull_request:
  push:
    branches: [feat/v1.0.0, master]

jobs:
  build-test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm biome ci .
      - run: pnpm -r build
      - run: pnpm -r test
