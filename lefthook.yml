# Git hooks. Installed automatically by `pnpm install`; skip once with LEFTHOOK=0.
pre-commit:
  commands:
    biome:
      glob: '*.{js,mjs,cjs,ts,tsx,json,jsonc}'
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm -r typecheck
